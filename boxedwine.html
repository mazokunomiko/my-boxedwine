<!doctype html>
<html lang="en-us">
  <head>
      <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>BoxedWine Drop Zone</title>
    <meta name="description" content="boxedwine emulator">
    <meta name="keywords" content="emulator,wine,windows,x86,PC,emscripten,web assembly,wasm,boxedwine">
    <meta name="author" content="James Bryant, Kevin O'Dwyer">
      <link rel="stylesheet" type="text/css" href="boxedwine.css">
  </head>
  <body>
  <div id="loading" style="display: none">
      <figure style="overflow:visible;" id="spinner"><div class="spinner"></div><center style="margin-top:0.5em"></center></figure>
      <div class="emscripten" id="status">Downloading...</div>
      <div class="emscripten">
          <progress value="0" max="100" id="progress" hidden=1></progress>
      </div>
  </div>

    <div id="inline">
        <div class="emscripten" style="margin: 20px 0; text-align: center;">
            <!-- We made the upload button visible so you can manually select a game zip file -->
            <button id="uploadbtn" style="display: inline-block; padding: 10px 20px; font-size: 18px; cursor: pointer;" onclick="document.getElementById('upload').click()">👉 Click to Select a Game ZIP File 👈</button>
            <input style="display: none" id="upload" name="upload" onchange="startWithFiles(event.target.files);" type="file" multiple />
            
            <button id="startbtn" style="display: none" onclick="start()">Start</button>
            <button id="downloadbtn" style="display: none" onclick="buildTree();">Get File(s)</button>
            <a style="display: none" id="modalLink" href="#openModal">Open</a>
            <a style="display: none" id="modalLinkExe" href="#openModalExe">Open</a>

          <span id="sound-checkbox" style="display: none">
              <input type="checkbox" id="soundToggle" onclick="toggleSound();">Enable Sound</input>
          </span>
          <br><br>
          <input type="checkbox" id="pointerLock" checked>Lock/hide mouse pointer
          <input type="checkbox" id="showConsole" onclick="toggleConsole();" checked>Show console
          &nbsp;&nbsp;&nbsp;
          <input type="checkbox" id="resize">Resize canvas
          <input type="button" value="Fullscreen" onclick="Module.requestFullScreen(document.getElementById('pointerLock').checked, document.getElementById('resize').checked)">
        </div>
        <div id="dropzone" style="border: 3px dashed #aaa; padding: 50px; text-align: center; margin: 20px; background: #fafafa;">
            <p style="font-size: 20px; color: #555;">... Or Drag & Drop your App ZIP File Right Here ...</p>
            <div class="emscripten_border" style="display:none;">
                <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()"></canvas>
            </div>
        </div>
        <div>
            <textarea class="emscripten" id="output" rows="8" style="display: none"></textarea>
        </div>
        <div id="openModal" class="modalDialog">
            <div> <a href="#close" title="Close" class="close" onclick="done();">X</a>
                <div>
                    <h3>Get File(s)</h3>
                    <input id="selectedItem" type="text" size="50" readonly>
                    <button onclick="extract();">Get</button>
                </div>
                <div id="tree">
                </div>
                <div>
                    <h3 id="loadStatus">Loading...</h3>
                </div>
            </div>
        </div>
        <div id="openModalExe" class="modalDialog">
            <div> <a id="openModalExeClick" href="#close" title="Close" class="close">X</a>
                <div>
                    <h3>Execute</h3>
                    <div id="message"></div>
                    <div id="items"></div>
                </div>
            </div>
        </div>
        <hr>
    </div>
        <script type="text/javascript" src="browserfs.min.js"></script>
        <script type="text/javascript" src="jszip.min.js"></script>
        <script type="text/javascript" src="boxedwine-shell.js"></script>
        <script>
        // This function handles the file selection, hooks up the emulator, and boots it manually
        function startWithFiles(files) {
            if (files.length === 0) return;
            document.getElementById('uploadbtn').style.display = 'none';
            document.getElementById('dropzone').getElementsByTagName('p')[0].style.display = 'none';
            document.getElementById('dropzone').getElementsByClassName('emscripten_border')[0].style.display = 'block';
            document.getElementById('loading').style.display = '';
            
            // Tell Boxedwine shell to read the manual file
            FileSystem.files = files; 
            
            var script = document.createElement('script');
            script.async = true;
            script.type = "text/javascript";
            script.src = "boxedwine.js";
            document.body.appendChild(script);
        }

        // Set up the dropzone drag-and-drop actions
        var dropzone = document.getElementById('dropzone');
        dropzone.ondragover = function () { this.style.background = '#e1f5fe'; return false; };
        dropzone.ondragleave = function () { this.style.background = '#fafafa'; return false; };
        dropzone.ondrop = function (e) {
            e.preventDefault();
            this.style.background = '#fafafa';
            startWithFiles(e.dataTransfer.files);
        };
        </script>
  </body>
</html>
